<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">FortiX Fraud Detection Platform Architecture</title>
<desc id="desc">Architecture diagram showing GNN modeling, analyst dashboard, graph analysis, documented capabilities, UPI client, and the fraud API with authentication, transaction storage, and demo scoring.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050814"/><stop offset=".55" stop-color="#090d1b"/><stop offset="1" stop-color="#10102a"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a2d" stop-opacity=".96"/><stop offset="1" stop-color="#080e1d" stop-opacity=".98"/></linearGradient>
  <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowViolet" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#a7b8d8"/></marker>
  <style>
    .h{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#f4f7ff}
    .sub{font:500 13px Inter,Segoe UI,Arial,sans-serif;fill:#aebbd2}
    .brand{font:800 38px Inter,Segoe UI,Arial,sans-serif;fill:#f8fbff;letter-spacing:-1px}
    .brandx{fill:#8b5cf6}
    .small{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#c9d5e9}
    .boxTitle{font:700 15px Inter,Segoe UI,Arial,sans-serif;fill:#eef5ff}
    .boxSub{font:500 12px Inter,Segoe UI,Arial,sans-serif;fill:#b6c5dc}
    .label{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#becbe0}
    .panel{fill:url(#panel);stroke-width:2;rx:18}
    .node{fill:#0d1a2e;stroke-width:1.7;rx:12}
    .flow{fill:none;stroke:#91a7c9;stroke-width:1.8;marker-end:url(#arr);opacity:.95}
    .dashed{stroke-dasharray:7 7}
  </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1490" cy="70" r="290" fill="#31106c" opacity=".13"/>
<circle cx="65" cy="835" r="280" fill="#0b5380" opacity=".10"/>
<path d="M0 780 Q400 860 760 840 T1600 790" stroke="#27305a" stroke-width="2" fill="none" opacity=".5"/>

<!-- Header -->
<g transform="translate(48 35)">
  <path d="M27 0 L52 14 L52 43 L27 59 L2 43 L2 14 Z" fill="none" stroke="#8b5cf6" stroke-width="4"/>
  <path d="M27 12 L41 20 L41 37 L27 46 L13 37 L13 20 Z" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <path d="M20 23 L27 18 L34 23 L31 33 L24 33 Z" fill="none" stroke="#c4b5fd" stroke-width="2"/>
  <text x="70" y="42" class="brand">Forti<tspan class="brandx">X</tspan></text>
  <path d="M220 6 V51" stroke="#52617d" stroke-width="2"/>
  <text x="244" y="26" class="h" font-size="22">Fraud Detection Platform</text>
  <text x="244" y="49" class="sub">GNN + Graph Analytics + Transaction Intelligence</text>
